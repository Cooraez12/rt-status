name: Status checks

on:
  schedule:
    - cron: "*/5 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checks and refresh incidents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Incident edits only refresh the notes; the 5-minute schedule records uptime.
          SKIP_CHECKS: ${{ (github.event_name == 'issues' || github.event_name == 'issue_comment') && '1' || '0' }}
        run: python scripts/check.py
      - name: Save results
        run: |
          git config user.name "rt-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Status update $(date -u +%Y-%m-%dT%H:%MZ)" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
