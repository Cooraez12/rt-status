<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RT.app Status</title>
<meta name="description" content="Live status of RT.app services: sign in, accounts, cards, adding money, transfers, payouts, checkout and API.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
:root{
  --bg:#f6f8fc;--surface:#fff;--border:#e8ecf3;--border-strong:#dce2ec;
  --ink:#0b1524;--ink-2:#4b5870;--ink-3:#8a95a8;
  --accent:#1f6bff;--accent-soft:#e7efff;
  --pos:#1ea672;--pos-soft:#e3f6ee;--neg:#e0524d;--neg-soft:#fdeceb;--warn:#c98a12;--warn-soft:#fbf2dd;
  --none:#e3e7ee;--r:16px;--r-sm:10px;--shadow:0 6px 24px rgba(16,30,54,.06);
  --font:'General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
header img{height:36px;width:auto;display:block}
header a.home{font-size:15px;font-weight:500}
.banner{border-radius:var(--r);padding:20px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin-bottom:28px}
.banner h1{font-size:20px;font-weight:600;margin:0}
.banner p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.banner .dot{flex:none;width:14px;height:14px;border-radius:50%}
.b-up{background:var(--pos-soft)}.b-up .dot{background:var(--pos)}
.b-slow{background:var(--warn-soft)}.b-slow .dot{background:var(--warn)}
.b-down{background:var(--neg-soft)}.b-down .dot{background:var(--neg)}
.b-wait{background:var(--surface)}.b-wait .dot{background:var(--ink-3)}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:28px;overflow:hidden}
.comp{padding:18px 22px;border-top:1px solid var(--border)}
.comp:first-child{border-top:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-weight:600}
.about{font-size:14px;color:var(--ink-2);margin-top:2px}
.state{font-size:14px;font-weight:500;white-space:nowrap}
.s-up{color:var(--pos)}.s-slow{color:var(--warn)}.s-down{color:var(--neg)}
.bars{display:flex;gap:2px;height:34px;margin-top:12px}
.bars i{flex:1;border-radius:3px;background:var(--none);min-width:2px}
.bars i.up{background:var(--pos)}.bars i.slow{background:var(--warn)}.bars i.down{background:var(--neg)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.inc{padding:18px 22px;border-top:1px solid var(--border)}
.inc:first-child{border-top:0}
.inc h3{margin:0;font-size:16px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:2px}
.t-open{background:var(--neg-soft);color:var(--neg)}.t-done{background:var(--pos-soft);color:var(--pos)}
.meta{font-size:13px;color:var(--ink-3);margin-top:2px}
.txt{white-space:pre-wrap;font-size:15px;color:var(--ink-2);margin-top:8px;overflow-wrap:anywhere}
.upd{border-left:3px solid var(--accent-soft);padding-left:12px;margin-top:10px}
.empty{padding:18px 22px;color:var(--ink-2);font-size:15px}
footer{font-size:13px;color:var(--ink-3);text-align:center;line-height:1.7}
@media (max-width:600px){
  .wrap{padding:20px 14px 36px}
  header img{height:30px}
  .banner{padding:16px}
  .banner h1{font-size:18px}
  .comp,.inc,.empty{padding:16px}
  .bars{height:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="https://rt.app"><img src="logo.png" alt="RT.app" width="162" height="63"></a>
    <a class="home" href="https://app.rt.app">Go to RT.app &rarr;</a>
  </header>

  <section id="banner" class="banner b-wait" aria-live="polite">
    <span class="dot"></span>
    <div><h1 id="headline">Checking our services&hellip;</h1><p id="checked"></p></div>
  </section>

  <section>
    <h2>Incidents</h2>
    <div class="card" id="incidents"><div class="empty">Loading&hellip;</div></div>
  </section>

  <section>
    <h2>Services</h2>
    <div class="card" id="components"></div>
  </section>

  <footer>
    We check every service every 5 minutes. Bars show each day: green working, amber slow, red down.<br>
    Need help? Email <a href="mailto:support@rt.app">support@rt.app</a>.
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
